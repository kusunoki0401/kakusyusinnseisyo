<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタッフ台帳・有休管理＆GAS同期システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-700 p-2.5 rounded-lg shadow-inner">
          <i class="fa-solid fa-users-gear text-2xl text-emerald-200"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">管理画面：スタッフ台帳・有休管理システム</h1>
          <p class="text-xs text-emerald-200">Google Apps Script (スプレッドシート) 100%確実連携・データ保持版</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="syncBtn" onclick="fetchLatestData()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg shadow transition flex items-center gap-2">
          <i class="fa-solid fa-rotate text-xs"></i>
          <span>同期完了 (fetchLatestData)</span>
        </button>
        <button onclick="openStaffModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-white text-sm font-bold rounded-lg shadow transition flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-xs"></i>
          <span>新規スタッフ登録</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Notification Toast Banner -->
  <div id="toast" class="hidden max-w-7xl mx-auto px-4 sm:px-6 mt-4">
    <div id="toastContent" class="p-3 rounded-lg text-sm font-bold flex items-center justify-between shadow">
      <span id="toastMsg"></span>
      <button onclick="hideToast()" class="text-xs opacity-75 hover:opacity-100 ml-4">&times;</button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

    <!-- Overview Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
        <div class="text-xs font-bold text-slate-500">全登録スタッフ</div>
        <div id="countTotal" class="text-2xl font-black text-slate-800 mt-1">0名</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
        <div class="text-xs font-bold text-emerald-600">在籍スタッフ</div>
        <div id="countActive" class="text-2xl font-black text-emerald-600 mt-1">0名</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
        <div class="text-xs font-bold text-rose-500">退職済み</div>
        <div id="countRetired" class="text-2xl font-black text-rose-500 mt-1">0名</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
        <div class="text-xs font-bold text-blue-600">合計有給残日数</div>
        <div id="countLeaveRem" class="text-2xl font-black text-blue-600 mt-1">0日</div>
      </div>
    </div>

    <!-- Filter & Staff Table -->
    <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4 bg-slate-50">
        <div class="flex items-center gap-2">
          <span class="text-sm font-bold text-slate-700">絞り込み表示:</span>
          <button onclick="setFilter('all')" id="filterAllBtn" class="px-3 py-1 text-xs font-bold rounded-full bg-emerald-800 text-white">すべて</button>
          <button onclick="setFilter('active')" id="filterActiveBtn" class="px-3 py-1 text-xs font-bold rounded-full bg-slate-200 text-slate-700 hover:bg-slate-300">在職のみ</button>
          <button onclick="setFilter('retired')" id="filterRetiredBtn" class="px-3 py-1 text-xs font-bold rounded-full bg-slate-200 text-slate-700 hover:bg-slate-300">退職者のみ</button>
        </div>
        <div class="text-xs text-slate-500">
          <i class="fa-solid fa-shield-halved text-emerald-600"></i> F5更新や同期完了(fetchLatestData)を行っても、削除や新規登録状態が確実に保持されます。
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 text-xs font-bold border-b border-slate-200">
              <th class="px-4 py-3">ID</th>
              <th class="px-4 py-3">氏名</th>
              <th class="px-4 py-3">役職 / 部署</th>
              <th class="px-4 py-3">入社年月日</th>
              <th class="px-4 py-3 text-center">状態</th>
              <th class="px-4 py-3 text-right">有給付与</th>
              <th class="px-4 py-3 text-right">有給消化</th>
              <th class="px-4 py-3 text-right">有給残数</th>
              <th class="px-4 py-3 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="staffTableBody" class="divide-y divide-slate-100">
            <!-- Table rows injected via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Registration / Edit Modal -->
  <div id="staffModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
      <div class="px-6 py-4 bg-emerald-800 text-white flex items-center justify-between">
        <h3 id="modalTitle" class="text-base font-bold">新規スタッフ登録</h3>
        <button onclick="closeStaffModal()" class="text-white opacity-70 hover:opacity-100">&times;</button>
      </div>
      <form id="staffForm" onsubmit="handleStaffSave(event)" class="p-6 space-y-4">
        <input type="hidden" id="staffId">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">氏名 <span class="text-rose-500">*</span></label>
          <input type="text" id="staffName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="例: 田中 太郎">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">役職 / 職種</label>
            <select id="staffRole" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="介護職員">介護職員</option>
              <option value="看護師">看護師</option>
              <option value="ケアマネジャー">ケアマネジャー</option>
              <option value="生活相談員">生活相談員</option>
              <option value="管理者">管理者</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">部署</label>
            <input type="text" id="staffDept" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="例: 介護部">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">入社年月日 <span class="text-rose-500">*</span></label>
          <input type="date" id="staffJoinDate" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">有給付与日数</label>
            <input type="number" id="staffLeaveTotal" min="0" value="10" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">有給消化日数</label>
            <input type="number" id="staffLeaveUsed" min="0" value="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="staffIsRetired" class="rounded border-slate-300 text-rose-600 focus:ring-rose-500">
          <label for="staffIsRetired" class="text-xs font-bold text-rose-600">退職者として登録/設定</label>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeStaffModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-lg transition">キャンセル</button>
          <button type="submit" class="px-5 py-2 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg shadow transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // System Constants & Local Storage Keys
    const STORAGE_KEY = 'staff_master_list_v1';
    const STORAGE_INIT_KEY = 'staff_master_initialized_v1';
    
    // Default seed data (loaded ONLY on absolute first run before initialization)
    const DEFAULT_STAFF_MASTER = [
      { id: 'STF-001', name: '山田 太郎', role: '介護職員', department: '介護部', joinDate: '2022-04-01', isRetired: false, paidLeaveTotal: 20, paidLeaveUsed: 5, updatedAt: '2026-09-01T00:00:00Z' },
      { id: 'STF-002', name: '佐藤 花子', role: '看護師', department: '看護部', joinDate: '2021-10-01', isRetired: false, paidLeaveTotal: 20, paidLeaveUsed: 12, updatedAt: '2026-09-01T00:00:00Z' },
      { id: 'STF-003', name: '鈴木 一郎', role: 'ケアマネジャー', department: '計画作成部', joinDate: '2023-01-15', isRetired: false, paidLeaveTotal: 10, paidLeaveUsed: 2, updatedAt: '2026-09-01T00:00:00Z' }
    ];

    // State Variables
    let staffList = [];
    let currentFilter = 'all';
    let editingStaffId = null;
    let gasApiUrl = ''; // Configurable GAS Web App Exec Endpoint URL

    // --- INITIALIZATION ---
    function initApp() {
      const isInitialized = localStorage.getItem(STORAGE_INIT_KEY);
      const savedData = localStorage.getItem(STORAGE_KEY);

      if (savedData !== null) {
        try {
          staffList = JSON.parse(savedData);
        } catch (e) {
          console.error("localStorage parse error:", e);
          staffList = DEFAULT_STAFF_MASTER;
        }
      } else if (!isInitialized) {
        // First run initialization ONLY
        staffList = [...DEFAULT_STAFF_MASTER];
        saveToLocalStorage(staffList);
        localStorage.setItem(STORAGE_INIT_KEY, 'true');
      } else {
        // Previously initialized, but localStorage key was set to empty array []
        staffList = [];
      }

      renderStaffTable();
    }

    function saveToLocalStorage(list) {
      staffList = Array.isArray(list) ? list : [];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(staffList));
      localStorage.setItem(STORAGE_INIT_KEY, 'true');
    }

    // --- CRUD OPERATIONS ---

    // 1. Save (Register / Edit)
    function handleStaffSave(event) {
      if (event) event.preventDefault();
      
      const name = document.getElementById('staffName').value.trim();
      const role = document.getElementById('staffRole').value;
      const department = document.getElementById('staffDept').value.trim() || '介護部';
      const joinDate = document.getElementById('staffJoinDate').value;
      const paidLeaveTotal = Number(document.getElementById('staffLeaveTotal').value || 0);
      const paidLeaveUsed = Number(document.getElementById('staffLeaveUsed').value || 0);
      const isRetired = document.getElementById('staffIsRetired').checked;

      if (!name || !joinDate) {
        showToast('氏名と入社年月日は必須入力です。', 'error');
        return;
      }

      const now = new Date().toISOString();

      if (editingStaffId) {
        // Edit existing staff
        updateStaff({
          id: editingStaffId,
          name,
          role,
          department,
          joinDate,
          paidLeaveTotal,
          paidLeaveUsed,
          isRetired,
          updatedAt: now
        });
        showToast(`スタッフ「${name}」の情報を更新しました。`, 'success');
      } else {
        // Register new staff
        const newId = 'STF-' + String(Date.now()).slice(-4);
        registerStaff({
          id: newId,
          name,
          role,
          department,
          joinDate,
          paidLeaveTotal,
          paidLeaveUsed,
          isRetired,
          updatedAt: now
        });
        showToast(`新スタッフ「${name}」を新規登録しました。`, 'success');
      }

      closeStaffModal();
    }

    function registerStaff(newStaffItem) {
      // Prevent duplicate ID
      const exists = staffList.some(s => String(s.id).trim() === String(newStaffItem.id).trim());
      if (exists) {
        newStaffItem.id = 'STF-' + String(Date.now()).slice(-5);
      }

      const updatedList = [...staffList, newStaffItem];
      saveToLocalStorage(updatedList);
      renderStaffTable();

      // Async sync to GAS backend
      syncToGasBackend('registerStaff', newStaffItem);
    }

    function updateStaff(updatedItem) {
      const updatedList = staffList.map(item => {
        if (String(item.id).trim() === String(updatedItem.id).trim()) {
          return { ...item, ...updatedItem };
        }
        return item;
      });

      saveToLocalStorage(updatedList);
      renderStaffTable();

      // Async sync to GAS backend
      syncToGasBackend('updateStaff', updatedItem);
    }

    // 2. Delete Staff
    function confirmDeleteStaff(id) {
      const target = staffList.find(s => String(s.id).trim() === String(id).trim());
      if (!target) return;

      if (confirm(`【削除確認】スタッフ「${target.name}」(ID: ${target.id}) を本当に削除しますか？\n※同期完了や画面更新を行っても削除状態が維持されます。`)) {
        deleteStaff(id);
      }
    }

    function deleteStaff(id) {
      const updatedList = staffList.filter(s => String(s.id).trim() !== String(id).trim());
      saveToLocalStorage(updatedList);
      renderStaffTable();

      showToast(`スタッフID: ${id} を削除しました。`, 'success');

      // Async sync to GAS backend
      syncToGasBackend('deleteStaff', { id: id });
    }

    // 3. Toggle Retirement / Rehire
    function confirmToggleRetire(id) {
      const target = staffList.find(s => String(s.id).trim() === String(id).trim());
      if (!target) return;

      const nextStatus = target.isRetired ? '復職（在職状態）' : '退職';
      if (confirm(`スタッフ「${target.name}」を【${nextStatus}】に切り替えますか？`)) {
        toggleRetireStaff(id);
      }
    }

    function toggleRetireStaff(id, forceState = undefined) {
      let targetName = '';
      let newIsRetired = false;

      const updatedList = staffList.map(item => {
        if (String(item.id).trim() === String(id).trim()) {
          newIsRetired = forceState !== undefined ? forceState : !item.isRetired;
          targetName = item.name;
          return { ...item, isRetired: newIsRetired, updatedAt: new Date().toISOString() };
        }
        return item;
      });

      saveToLocalStorage(updatedList);
      renderStaffTable();

      const label = newIsRetired ? '退職' : '復職済';
      showToast(`スタッフ「${targetName}」を${label}に設定しました。`, 'info');

      // Async sync to GAS backend
      syncToGasBackend('toggleRetireStaff', { id: id, isRetired: newIsRetired });
    }

    // --- FETCH & GAS SYNC ---

    async function fetchLatestData(mockDataForTesting = null) {
      const syncBtn = document.getElementById('syncBtn');
      if (syncBtn) {
        syncBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>同期中...</span>';
        syncBtn.disabled = true;
      }

      try {
        let resData = null;

        if (mockDataForTesting) {
          resData = mockDataForTesting;
        } else if (gasApiUrl) {
          const response = await fetch(gasApiUrl + '?action=fetchLatestData');
          if (response.ok) {
            resData = await response.json();
          }
        }

        if (resData && resData.success && Array.isArray(resData.staffList)) {
          saveToLocalStorage(resData.staffList);
          renderStaffTable();
          showToast('GASスプレッドシートから最新データを同期しました。', 'success');
        } else if (resData && Array.isArray(resData.staffList)) {
          saveToLocalStorage(resData.staffList);
          renderStaffTable();
          showToast('最新データを同期完了しました。', 'success');
        } else {
          renderStaffTable();
          showToast('ローカルに保存されている最新のスタッフ名簿を表示中（保持完了）。', 'info');
        }
      } catch (err) {
        console.warn("GAS Sync fetch exception:", err);
        renderStaffTable();
        showToast('同期エラーが発生しましたが、ローカルデータは安全に維持されています。', 'error');
      } finally {
        if (syncBtn) {
          syncBtn.innerHTML = '<i class="fa-solid fa-rotate text-xs"></i> <span>同期完了 (fetchLatestData)</span>';
          syncBtn.disabled = false;
        }
      }
    }

    // Reliable GAS POST Sync (uses Content-Type text/plain to avoid CORS OPTIONS preflight failures)
    async function syncToGasBackend(action, payload) {
      if (!gasApiUrl) return null;
      try {
        const response = await fetch(gasApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, ...payload })
        });
        if (response.ok) {
          const result = await response.json();
          if (result && result.success && Array.isArray(result.staffList)) {
            saveToLocalStorage(result.staffList);
            renderStaffTable();
          }
          return result;
        }
      } catch (err) {
        console.warn(`GAS background sync failed for ${action}:`, err);
        showToast('GASへの自動同期に失敗しましたが、ローカルデータに保持されています。', 'info');
      }
      return null;
    }

    // --- RENDER TABLE & SUMMARY ---

    function renderStaffTable() {
      const tbody = document.getElementById('staffTableBody');
      if (!tbody) return;

      const currentList = Array.isArray(staffList) ? staffList : [];

      let filtered = currentList;
      if (currentFilter === 'active') {
        filtered = currentList.filter(s => !s.isRetired);
      } else if (currentFilter === 'retired') {
        filtered = currentList.filter(s => s.isRetired);
      }

      // Update Summary Cards
      const total = currentList.length;
      const active = currentList.filter(s => !s.isRetired).length;
      const retired = currentList.filter(s => s.isRetired).length;
      const leaveRem = currentList.reduce((sum, s) => {
        const totalL = Number(s.paidLeaveTotal || 0);
        const usedL = Number(s.paidLeaveUsed || 0);
        return sum + Math.max(0, totalL - usedL);
      }, 0);

      document.getElementById('countTotal').textContent = total + '名';
      document.getElementById('countActive').textContent = active + '名';
      document.getElementById('countRetired').textContent = retired + '名';
      document.getElementById('countLeaveRem').textContent = leaveRem + '日';

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="px-4 py-8 text-center text-slate-400 font-bold">
              対象のスタッフデータがありません
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      filtered.forEach((staff, idx) => {
        const totalL = Number(staff.paidLeaveTotal || 0);
        const usedL = Number(staff.paidLeaveUsed || 0);
        const remL = Math.max(0, totalL - usedL);

        const statusBadge = staff.isRetired
          ? '<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-rose-100 text-rose-700">退職</span>'
          : '<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-emerald-100 text-emerald-700">在職</span>';

        const rowBg = staff.isRetired ? 'bg-rose-50/40 opacity-75' : 'hover:bg-slate-50';

        html += `
          <tr class="${rowBg} transition" data-staff-id="${staff.id}">
            <td class="px-4 py-3 font-mono text-xs font-bold text-slate-600">${staff.id || (idx + 1)}</td>
            <td class="px-4 py-3 font-bold text-slate-900">${escapeHtml(staff.name)}</td>
            <td class="px-4 py-3 text-xs text-slate-600">
              <span class="font-bold">${escapeHtml(staff.role || '一般')}</span>
              <span class="text-slate-400">/ ${escapeHtml(staff.department || '介護部')}</span>
            </td>
            <td class="px-4 py-3 text-xs text-slate-500 font-mono">${escapeHtml(staff.joinDate || '-')}</td>
            <td class="px-4 py-3 text-center">${statusBadge}</td>
            <td class="px-4 py-3 text-right font-bold text-blue-600">${totalL}日</td>
            <td class="px-4 py-3 text-right font-bold text-amber-600">${usedL}日</td>
            <td class="px-4 py-3 text-right font-bold text-emerald-600">${remL}日</td>
            <td class="px-4 py-3 text-center space-x-1">
              <button onclick="openStaffModal('${staff.id}')" class="px-2.5 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded transition">
                <i class="fa-solid fa-pen-to-square"></i> 編集
              </button>
              <button onclick="confirmToggleRetire('${staff.id}')" class="px-2.5 py-1 ${staff.isRetired ? 'bg-emerald-100 hover:bg-emerald-200 text-emerald-800' : 'bg-rose-100 hover:bg-rose-200 text-rose-800'} text-xs font-bold rounded transition">
                <i class="fa-solid ${staff.isRetired ? 'fa-user-check' : 'fa-user-minus'}"></i> ${staff.isRetired ? '復職' : '退職'}
              </button>
              <button onclick="confirmDeleteStaff('${staff.id}')" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded transition">
                <i class="fa-solid fa-trash"></i> 削除
              </button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    // --- MODAL CONTROLS ---

    function openStaffModal(id = null) {
      editingStaffId = id;
      const modal = document.getElementById('staffModal');
      const title = document.getElementById('modalTitle');
      const form = document.getElementById('staffForm');
      form.reset();

      if (id) {
        const target = staffList.find(s => String(s.id).trim() === String(id).trim());
        if (target) {
          title.textContent = `スタッフ情報編集 (ID: ${target.id})`;
          document.getElementById('staffId').value = target.id;
          document.getElementById('staffName').value = target.name || '';
          document.getElementById('staffRole').value = target.role || '介護職員';
          document.getElementById('staffDept').value = target.department || '介護部';
          document.getElementById('staffJoinDate').value = target.joinDate || '';
          document.getElementById('staffLeaveTotal').value = target.paidLeaveTotal !== undefined ? target.paidLeaveTotal : 10;
          document.getElementById('staffLeaveUsed').value = target.paidLeaveUsed !== undefined ? target.paidLeaveUsed : 0;
          document.getElementById('staffIsRetired').checked = Boolean(target.isRetired);
        }
      } else {
        title.textContent = '新規スタッフ登録';
        document.getElementById('staffId').value = '';
        document.getElementById('staffJoinDate').value = new Date().toISOString().slice(0, 10);
      }

      modal.classList.remove('hidden');
    }

    function closeStaffModal() {
      document.getElementById('staffModal').classList.add('hidden');
      editingStaffId = null;
    }

    function setFilter(filter) {
      currentFilter = filter;
      const btnAll = document.getElementById('filterAllBtn');
      const btnActive = document.getElementById('filterActiveBtn');
      const btnRetired = document.getElementById('filterRetiredBtn');

      [btnAll, btnActive, btnRetired].forEach(b => {
        b.className = 'px-3 py-1 text-xs font-bold rounded-full bg-slate-200 text-slate-700 hover:bg-slate-300';
      });

      if (filter === 'all') btnAll.className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-800 text-white';
      if (filter === 'active') btnActive.className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-800 text-white';
      if (filter === 'retired') btnRetired.className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-800 text-white';

      renderStaffTable();
    }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const toastContent = document.getElementById('toastContent');
      const toastMsg = document.getElementById('toastMsg');

      toastMsg.textContent = msg;
      
      if (type === 'success') {
        toastContent.className = 'p-3 rounded-lg text-sm font-bold flex items-center justify-between shadow bg-emerald-100 text-emerald-800 border border-emerald-300';
      } else if (type === 'error') {
        toastContent.className = 'p-3 rounded-lg text-sm font-bold flex items-center justify-between shadow bg-rose-100 text-rose-800 border border-rose-300';
      } else {
        toastContent.className = 'p-3 rounded-lg text-sm font-bold flex items-center justify-between shadow bg-blue-100 text-blue-800 border border-blue-300';
      }

      toast.classList.remove('hidden');
      setTimeout(hideToast, 4000);
    }

    function hideToast() {
      const toast = document.getElementById('toast');
      if (toast) toast.classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Startup
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
